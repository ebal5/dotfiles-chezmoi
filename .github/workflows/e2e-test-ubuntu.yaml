name: E2E Test - Ubuntu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e-test-ubuntu:
    name: Ubuntu Dotfiles Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply chezmoi (exclude scripts)
        run: |
          # Link checkout to chezmoi's expected source directory
          mkdir -p "$HOME/.local/share"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.local/share/chezmoi"

          # Create chezmoi config with required template variables
          mkdir -p "$HOME/.config/chezmoi"
          cat > "$HOME/.config/chezmoi/chezmoi.toml" << 'EOF'
          [data.chezmoi]
            requireGUI = false
          EOF

          # Apply dotfiles (skip heavy setup scripts)
          "$HOME/.local/bin/chezmoi" apply --exclude scripts --force

      - name: Verify dotfiles
        run: |
          echo "=== Verifying dotfiles installation ==="

          expected_files=(
            "$HOME/.bashrc"
            "$HOME/.bash_profile"
            "$HOME/.profile"
            "$HOME/.gitconfig"
            "$HOME/.vimrc"
            "$HOME/.zshrc"
            "$HOME/.zshenv"
            "$HOME/once_setup_ubuntu.sh"
          )

          errors=0
          for file in "${expected_files[@]}"; do
            if [ -f "$file" ]; then
              echo "[OK] $file exists"
            else
              echo "[ERROR] $file is missing"
              errors=$((errors + 1))
            fi
          done

          if [ -d "$HOME/.config" ]; then
            echo "[OK] ~/.config directory exists"
          else
            echo "[ERROR] ~/.config directory is missing"
            errors=$((errors + 1))
          fi

          # Windows専用の成果物がホームに現れないことを実挙動で確かめる（#217）。
          # Linux側は `.chezmoiignore` とテンプレートの空レンダリングの二重で
          # 除外されているため、どちらが壊れてもここで落ちる
          unexpected_files=(
            "$HOME/once_setup_windows.ps1"
            "$HOME/.config/powershell"
          )
          for file in "${unexpected_files[@]}"; do
            if [ -e "$file" ]; then
              echo "[ERROR] $file should be excluded on Linux (.chezmoiignore を確認すること)"
              errors=$((errors + 1))
            else
              echo "[OK] $file is excluded"
            fi
          done

          echo ""
          echo "=== Summary ==="
          if [ $errors -eq 0 ]; then
            echo "All dotfiles verified successfully!"
            exit 0
          else
            echo "$errors check(s) failed"
            exit 1
          fi

      - name: Show applied files
        if: always()
        run: |
          echo "=== chezmoi managed files ==="
          "$HOME/.local/bin/chezmoi" managed --include files || true

          echo ""
          echo "=== Home directory structure ==="
          ls -la "$HOME" || true
