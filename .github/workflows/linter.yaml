---
name: Lint All

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  shfmt:
    name: run shfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          shfmt -i 2 -ci -w .
      - name: suggester / shfmt
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: shfmt
      - name: install shellcheck
        run: |
          scversion="latest"
          wget -qO- "https://github.com/koalaman/shellcheck/releases/download/${scversion?}/shellcheck-${scversion?}.linux.x86_64.tar.xz" | tar -xJv
          sudo cp "shellcheck-${scversion}/shellcheck" /usr/local/bin/
          rm -rf "shellcheck-${scversion}/shellcheck"
      - run: shfmt -f . | xargs shellcheck -f diff | patch -p1
      - name: suggester / shellcheck
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: shellcheck
      # 上の suggester は `-f diff` の性質上「自動修正案を作れる指摘」しか
      # 報告せず、SC2154 のような指摘は素通りする。ここでハード fail させて
      # 修正案を作れない指摘も落とす。
      # 自動修正できる指摘は上の patch 適用済みなのでここでは落ちない
      # （そちらは suggester のレビューコメントと prek が担保する）
      - name: shellcheck (hard fail)
        run: shfmt -f . | xargs shellcheck
  markdownlint:
    name: runner / markdownlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install markdownlint-cli2
        # バージョンは dot_config/shim-definitions を単一情報源として抽出する。
        # ここにハードコードするとローカルの pnpm shim と黙って乖離するため。
        # この形を保っているかは .github/scripts/check-repo-conventions.sh が検査する
        run: |
          set -euo pipefail
          version=$(sed -n 's/^pnpm:markdownlint-cli2@\(.*\):markdownlint-cli2$/\1/p' dot_config/shim-definitions)
          if [ -z "$version" ]; then
            echo "::error::dot_config/shim-definitions から markdownlint-cli2 のバージョンを抽出できなかった。定義の形式を確認すること。"
            exit 1
          fi
          echo "markdownlint-cli2@${version} をインストールする"
          npm install -g "markdownlint-cli2@${version}"
      - name: Run markdownlint-cli2 with reviewdog
        uses: reviewdog/action-setup@v1
      - name: markdownlint
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          markdownlint-cli2 "**/*.md" 2>&1 | reviewdog -efm="%f:%l:%c %m" -efm="%f:%l %m" -name="markdownlint" -reporter=github-pr-review -fail-on-error
