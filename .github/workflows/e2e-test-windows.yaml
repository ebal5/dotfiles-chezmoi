name: E2E Test - Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e-test-windows:
    name: Windows Dotfiles Setup
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install chezmoi
        shell: pwsh
        run: |
          winget install --id twpayne.chezmoi --accept-source-agreements --accept-package-agreements
          # Add to PATH for subsequent steps
          $chezmoiPath = "$env:LOCALAPPDATA\Microsoft\WinGet\Links"
          Add-Content $env:GITHUB_PATH $chezmoiPath

      - name: Apply chezmoi (exclude scripts)
        shell: pwsh
        run: |
          # Link checkout to chezmoi's expected source directory
          $chezmoiSource = "$env:USERPROFILE\.local\share\chezmoi"
          New-Item -ItemType Directory -Path (Split-Path $chezmoiSource) -Force | Out-Null
          New-Item -ItemType Junction -Path $chezmoiSource -Target "$env:GITHUB_WORKSPACE" -Force | Out-Null

          # Apply dotfiles (skip heavy setup scripts)
          chezmoi apply --exclude scripts --force

      - name: Verify dotfiles
        shell: pwsh
        run: |
          Write-Host "=== Verifying dotfiles installation ==="

          $expectedFiles = @(
            "$env:USERPROFILE\.gitconfig"
            "$env:USERPROFILE\.vimrc"
            "$env:USERPROFILE\once_setup_windows.ps1"
          )

          $errors = 0
          foreach ($file in $expectedFiles) {
            if (Test-Path $file) {
              Write-Host "[OK] $file exists"
            } else {
              Write-Host "[ERROR] $file is missing"
              $errors++
            }
          }

          if (Test-Path "$env:USERPROFILE\.config") {
            Write-Host "[OK] ~/.config directory exists"
          } else {
            Write-Host "[ERROR] ~/.config directory is missing"
            $errors++
          }

          # `.chezmoiignore` のプラットフォーム別ブロックがターゲットパスで
          # 書かれていることを確かめる。ファイルの有無だけでは足りない。
          # `executable_once_setup_ubuntu.sh.tmpl` は全体が条件分岐の中にあり
          # Windows では空にレンダリングされるため、`.chezmoiignore` が壊れていても
          # 実体は現れない。`.chezmoiignore` の側が実際に効いているかは
          # 管理対象集合にしか出ないので、`chezmoi managed` を見る
          $managed = chezmoi managed --include files 2>$null
          if ($LASTEXITCODE -ne 0) {
            # 空の集合に対して「除外されている」と報告しないこと。
            # 読めなかったのであってアサーションは成立していない
            Write-Host "[ERROR] chezmoi managed failed with exit code $LASTEXITCODE"
            $errors++
          } else {
            $unexpectedTargets = @(
              "once_setup_ubuntu.sh"
            )
            foreach ($target in $unexpectedTargets) {
              if ($managed -contains $target) {
                Write-Host "[ERROR] $target is still managed on Windows (.chezmoiignore を確認すること)"
                $errors++
              } else {
                Write-Host "[OK] $target is excluded from the managed set"
              }
            }
          }

          $unexpectedFiles = @(
            "$env:USERPROFILE\once_setup_ubuntu.sh"
          )
          foreach ($file in $unexpectedFiles) {
            if (Test-Path $file) {
              Write-Host "[ERROR] $file should not exist on Windows"
              $errors++
            } else {
              Write-Host "[OK] $file is absent"
            }
          }

          Write-Host ""
          Write-Host "=== Summary ==="
          if ($errors -eq 0) {
            Write-Host "All dotfiles verified successfully!"
            exit 0
          } else {
            Write-Host "$errors check(s) failed"
            exit 1
          }

      - name: Show applied files
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== chezmoi managed files ==="
          chezmoi managed --include files 2>$null

          Write-Host ""
          Write-Host "=== Home directory structure ==="
          Get-ChildItem -Force $env:USERPROFILE | Format-Table Name, LastWriteTime, Length
