---
name: Repo Conventions

on:
  pull_request:
    paths:
      # GitHub の filter pattern では `**` は「スラッシュを含む0文字以上の
      # 任意の文字列」。`**/*.tmpl` はスラッシュを要求するため、ルート直下の
      # `.tmpl`（ランチャー3本）に当たらない。`**.` の形で書く
      - "**.tmpl"
      - "dot_config/shim-definitions"
      # chezmoi はサブディレクトリの `.chezmoiignore` も読む
      - "**.chezmoiignore"
      - "**.chezmoiremove"
      # バージョン同期チェックの対象。linter.yaml だけを書き換えたPRでも走らせる
      - ".github/workflows/linter.yaml"
      - ".github/scripts/check-repo-conventions.sh"

jobs:
  check:
    name: Check repo conventions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check chezmoi/shim conventions
        run: .github/scripts/check-repo-conventions.sh
