# markdownlint-cli2 configuration
# https://github.com/DavidAnson/markdownlint-cli2

# Claude Code commands/skills use frontmatter and don't require first-line headings
ignores:
  - "dot_claude/commands/**"
  - "dot_claude/skills/**"

# Default rules
config:
  # Allow longer lines in code blocks
  MD013: false
  # テーブルはcompact style固定。既定の "consistent" はファイル内で揃っていれば
  # aligned styleも通してしまい、CJK文字幅で崩れたテーブルを検出できない
  MD060:
    style: compact
